[project]
name = "compass"
version = "0.2.0"
description = "Computational pathology and spatial statistics"
authors = [
    {name = "Vlad Popovici", email = "popovici@bioxlab.org"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
# Core runtime dependencies (compass.core): keep this list minimal — see
# docs/architecture.md section 5.
dependencies = [
    "numpy>=2.0",
    "zarr>=3.0.8",
    "shapely>=2.1.2,<3.0.0",
    "geopandas>=1.0",
    "polars>=1.9",
    "pandas>=2.2",
    "pydantic>=2.12.5,<3.0.0",
    "dask[array,dataframe]>=2025.1.0",
]

[project.optional-dependencies]
# Ingestion / interchange tools (compass.connector) — heavy, volatile deps,
# never needed by the running viewer.
connector = [
    "pyvips>=3.1.1,<4.0.0",
    "openslide-bin>=4.0.0.10,<5.0.0.0",
    "openslide-python>=1.4.3,<2.0.0",
    "h5py>=3.15.1,<4.0.0",
    "hdf5plugin>=6.0.0,<7.0.0",
    "tifffile>=2024.8.30",
]
# Domain algorithms (compass.processing).
processing = [
    "scikit-image>=0.25.2,<0.26.0",
    "scikit-learn>=1.8.0,<2.0.0",
    "mahotas>=1.4.18,<2.0.0",
    "opencv-python-headless>=4.12.0.88,<5.0.0.0",
    "simpleitk>=2.5.3,<3.0.0",
]
# Everything the legacy modules (compass.legacy) still import; goes away as
# the migration completes.
legacy = [
    "compass[connector,processing]",
    "simplejson>=3.20.2,<4.0.0",
    "orjson>=3.11.5,<4.0.0",
    "tqdm>=4.67.1,<5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "matplotlib>=3.10.8,<4.0.0",
    "ipython>=9.8.0,<10.0.0",
    "jupyterlab>=4.5.1,<5.0.0",
    "ipywidgets>=8.1.8,<9.0.0",
    "pandas-stubs>=2.3.3,<2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass"]

[tool.pytest.ini_options]
testpaths = ["src/compass/tests"]
